title: "Ravi Sankar Manem"
name: "Ravi Sankar Manem"

description: >-
  Java Backend Engineer | AI Engineer | Cybersecurity Enthusiast

url: "https://ravimnm.github.io"
baseurl: ""

repository: "ravimnm/ravimnm.github.io"

remote_theme: "mmistakes/minimal-mistakes"

minimal_mistakes_skin: "dark"

search: true

author:
  name: "Ravi Sankar Manem"
  avatar: "/assets/images/profile.jpg"
  bio: >
    Computer Science student passionate about building scalable backend systems,
    AI-powered applications, and security-focused software.

  location: "Andhra Pradesh, India"

  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ravimnm"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "YOUR_LINKEDIN"

    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:YOUR_EMAIL"


plugins:
  - jekyll-include-cache

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
